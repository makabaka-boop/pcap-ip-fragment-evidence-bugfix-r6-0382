<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地 PCAP 重组器（限定版）</title>
<style>
  :root {
    --bg:#0f1419; --panel:#171d24; --panel2:#1d242d; --border:#2b3440;
    --text:#d6dee6; --dim:#8a97a5; --accent:#5aa7ff; --ok:#4cc38a;
    --warn:#e0a13c; --err:#ef6b6b; --gap:#8a6d3b; --conflict:#b34747;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border);
           display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  button, select, label.btn {
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:5px; padding:5px 12px; font-size:13px; cursor:pointer;
  }
  button:hover, label.btn:hover { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { border-color:var(--accent); color:var(--accent); }
  #drop-zone.dragover { outline:2px dashed var(--accent); outline-offset:-4px; }
  main { display:grid; grid-template-columns:330px 1fr; height:calc(100vh - 56px); }
  #sidebar { background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; }
  #detail { overflow-y:auto; padding:14px 18px; min-width:0; }
  .conn { padding:9px 14px; border-bottom:1px solid var(--border); cursor:pointer; }
  .conn:hover { background:var(--panel2); }
  .conn.active { background:#20303f; border-left:3px solid var(--accent); padding-left:11px; }
  .conn .ep { font-family:var(--mono); font-size:11.5px; word-break:break-all; }
  .conn .meta { color:var(--dim); font-size:11px; margin-top:2px; display:flex; gap:8px; flex-wrap:wrap;}
  .badge { display:inline-block; padding:0 6px; border-radius:9px; font-size:10.5px;
           border:1px solid var(--border); color:var(--dim); }
  .badge.gap { color:var(--warn); border-color:var(--warn); }
  .badge.conflict { color:var(--err); border-color:var(--err); }
  .badge.ok { color:var(--ok); border-color:var(--ok); }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:12px; }
  .tabs .tab { padding:6px 14px; cursor:pointer; border-bottom:2px solid transparent; color:var(--dim); }
  .tabs .tab.active { color:var(--text); border-bottom-color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-family:var(--mono); font-size:11.5px; }
  th,td { text-align:left; padding:3px 8px; border-bottom:1px solid var(--border);
          white-space:nowrap; vertical-align:top; }
  th { color:var(--dim); font-weight:500; position:sticky; top:0; background:var(--bg); }
  tr.pkt-row.selected td { background:#20303f; }
  .marks span { margin-right:5px; font-size:10.5px; padding:0 4px; border-radius:3px; }
  .m-retrans { background:#1e3a2c; color:var(--ok); }
  .m-ooo { background:#3a351e; color:var(--warn); }
  .m-conflict { background:#3d2020; color:var(--err); }
  .m-trunc { background:#33284a; color:#b794e8; }
  .discard { color:var(--dim); font-style:italic; }
  pre.stream { background:#0b0f14; border:1px solid var(--border); border-radius:6px;
    padding:10px 12px; font-family:var(--mono); font-size:12px; white-space:pre-wrap;
    word-break:break-all; margin:0; max-height:65vh; overflow:auto; }
  .tok-gap { background:var(--gap); color:#1a140a; border-radius:2px; padding:0 2px; }
  .tok-conflict { background:var(--conflict); color:#fff; border-radius:2px; padding:0 3px;
                 font-weight:600; cursor:help; }
  .hex-table { font-family:var(--mono); font-size:11.5px; border-collapse:collapse; }
  .hex-table td { padding:1px 6px; border:none; white-space:pre; }
  .hex-table .off { color:var(--dim); }
  .hex-cell-gap { color:#6b5627; }
  .hex-cell-conflict { background:var(--conflict); color:#fff; border-radius:2px; }
  .hex-ascii { color:var(--dim); }
  .note { color:var(--dim); font-size:11.5px; margin:6px 0 12px; }
  .item { border:1px solid var(--border); border-radius:6px; padding:8px 12px; margin-bottom:8px;
          background:var(--panel); }
  .item.gap { border-left:3px solid var(--warn); }
  .item.conflict { border-left:3px solid var(--err); }
  code { font-family:var(--mono); background:var(--panel2); padding:0 4px; border-radius:3px; }
  #status { position:fixed; bottom:14px; right:16px; max-width:420px; padding:10px 14px;
            background:var(--panel2); border:1px solid var(--border); border-radius:8px;
            display:none; z-index:50; box-shadow:0 6px 24px rgba(0,0,0,.5); }
  #status.show { display:block; }
  #status.fatal { border-color:var(--err); }
  #status.info { border-color:var(--accent); }
  .dirseg { font-family:var(--mono); font-size:11.5px; color:var(--dim); }
  .pill { font-size:10.5px; padding:0 7px; border-radius:10px; border:1px solid var(--border);}
  .placeholder { color:var(--dim); padding:40px 20px; text-align:center; }
  .kv { color:var(--dim); } .kv b { color:var(--text); font-weight:500; }
</style>
</head>
<body>
<div id="drop-zone">
<header>
  <div>
    <h1>本地 PCAP 重组器 <span class="sub">限定版：≤8 MB / ≤2000 包 · 小端 PCAP · 以太网 / IPv4 / TCP · 不上传</span></h1>
  </div>
  <label class="btn">选择文件
    <input id="file-input" type="file" accept=".pcap,.cap,application/vnd.tcpdump.pcap" hidden>
  </label>
  <button id="cancel-btn" disabled>取消解析</button>
  <button id="export-json" disabled>导出 JSON（无损）</button>
  <button id="export-txt" disabled>导出 TXT（有损文本）</button>
  <span id="file-info" class="sub"></span>
</header>

<main>
  <aside id="sidebar">
    <div class="placeholder" id="conn-placeholder">尚未导入文件<br><br>
      点击「选择文件」或将 .pcap 拖入页面。<br>所有解析均在本机 Worker 中完成。
    </div>
    <div id="conn-list"></div>
  </aside>
  <section id="detail">
    <div class="placeholder">选择左侧连接查看包、缺口、冲突与重组结果</div>
  </section>
</main>
</div>

<div id="status"></div>

<script src="js/core/util.js"></script>
<script src="js/core/pcap.js"></script>
<script src="js/core/fragments.js"></script>
<script src="js/core/reassemble.js"></script>
<script src="js/core/viewmodel.js"></script>
<script src="js/main.js"></script>
</body>
</html>
